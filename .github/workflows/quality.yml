name: Readiness quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Static checks and debt ratchets
        run: npm run quality:fast
      - name: Generate-contract freshness
        run: npm run docs:check
      - name: Legacy declarations for offline API adapters
        run: npm run build:legacy
      - name: Collect tests without executing them
        run: npm run test:list
      - name: Four-app critical-interface coverage and dynamic API security
        run: npm run test:coverage
      - name: Secret scan and dependency advisory ratchet
        run: npm run verify:secrets && npm run quality:security
      - name: Retain timing, retries, coverage and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-quality-${{ github.run_id }}
          path: output/quality/
          if-no-files-found: error
          retention-days: 14

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build with incremental TypeScript and stage timing
        run: npm run build:tracked
      # Plugin client bundling uses the user's external Harness adapter, not an
      # invented cloud dependency. Check the portable web budget in this job.
      - name: Check portable web bundle budget
        run: npm run quality:bundles -- --web-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-build-${{ github.run_id }}
          path: output/quality/
          retention-days: 14
